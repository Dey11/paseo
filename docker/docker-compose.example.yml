# Minimal HanabiCode daemon + web UI deployment.
#
# Open http://localhost:6769 after `docker compose up -d`.
# For any network-reachable deployment, change PASEO_PASSWORD first.
services:
  hanabicode:
    image: ghcr.io/dey11/hanabicode:latest
    container_name: hanabicode
    restart: unless-stopped
    ports:
      - "6769:6769"
    environment:
      PASEO_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # PASEO_HOSTNAMES: "hanabicode.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./hanabicode-home:/home/hanabicode
      # Code visible to HanabiCode and the agents it launches.
      - ./workspace:/workspace
