name: HanabiCode Daemon Image Check

on:
  pull_request:
    branches: [main, hanabicode]
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "packages/app/**"
      - "packages/cli/**"
      - "packages/client/**"
      - "packages/expo-two-way-audio/**"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/protocol/**"
      - "packages/relay/**"
      - "packages/server/**"
  push:
    branches: [main, hanabicode]
  workflow_dispatch:

concurrency:
  group: docker-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build daemon image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            HANABICODE_VERSION=${{ github.sha }}
          tags: hanabicode:check-${{ github.sha }}
          push: false
          provenance: false
          cache-from: type=gha,scope=hanabicode
          cache-to: type=gha,scope=hanabicode,mode=max
